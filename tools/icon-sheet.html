<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff)}body{margin:0;background:#f6e3c4;font:12px Fredoka,sans-serif}</style></head>
<body><canvas id="c"></canvas>
<script src="../js/models.js"></script><script src="../js/icons.js"></script>
<script>
document.fonts.load('900 40px Fredoka').then(() => {
  const names = BL.Icons.names().concat(['o:stand','o:clips','o:keys','o:helmet','o:figure','o:gears','o:vase','o:case','o:bumper','o:vent','o:bracket','o:insert','o:pot','o:litho','o:sign','o:fidget','o:picase','o:insole','o:chess','o:racecar','o:knob','o:drone','o:topo','o:proto','o:arch','o:grip','o:bonsai']);
  const S = +(new URLSearchParams(location.search).get('s') || 72), cols = 12, cw = S + 20, ch = S + 18;
  const c = document.getElementById('c'); c.width = cols * cw; c.height = Math.ceil(names.length / cols) * ch; const g = c.getContext('2d');
  names.forEach((n, i) => { const x = (i % cols) * cw, y = Math.floor(i / cols) * ch; BL.Icons.draw(g, n, x + cw / 2, y + S / 2 + 2, S); g.fillStyle = '#5a3a22'; g.textAlign = 'center'; g.fillText(n, x + cw / 2, y + S + 14); });
  document.title = 'done';
});
</script></body></html>
